name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Provision pinned inputs
        run: ./tools/bootstrap.sh
      - name: Run every check
        run: python3 tools/run_tests.py

  corpus:
    name: corpus reproduces byte-for-byte
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Provision pinned inputs
        run: ./tools/bootstrap.sh
      - name: Rebuild the corpus and compare
        run: python3 tools/verify_corpus.py
